*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.emptysec{padding:4px 12px 12px;font-size:14px;color:var(--md-sys-color-on-surface-variant)}

.sheet h3{margin:0 0 16px;font-size:22px;line-height:28px;font-weight:500}

input.t,textarea{width:100%;min-height:56px;padding:0 16px;font:inherit;font-size:16px;color:var(--md-sys-color-on-surface);background:var(--md-sys-color-surface-container-highest);border:0;border-bottom:1px solid var(--md-sys-color-on-surface-variant);border-radius:4px 4px 0 0;outline:none}

<div class="backlight"></div>
<header>

  <span class="pill prog" id="prog" aria-live="polite"></span></div>
 <div class="hrow"><div class="sub" style="flex:1">Items to grab</div>
